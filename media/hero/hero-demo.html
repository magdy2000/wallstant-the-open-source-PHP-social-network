<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Video</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #000; }
  .hero {
    position: relative;
    height: 100vh;
    min-height: 520px;
    overflow: hidden;
  }
  .hero__video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Optional dark layer so text placed over it stays readable */
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
  }
  @media (prefers-reduced-motion: reduce) {
    .hero__video { display: none; }
    .hero { background: url(hero-poster.jpg) center / cover no-repeat; }
  }
</style>
</head>
<body>
  <section class="hero">
    <video class="hero__video" autoplay muted loop playsinline preload="auto" poster="hero-poster.jpg">
      <source src="hero-bg.webm" type="video/webm">
      <source src="hero-bg.mp4" type="video/mp4">
    </video>
  </section>
</body>
</html>
